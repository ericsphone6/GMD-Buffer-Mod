
name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: macOS
            os: macos-latest
            target: MacOS

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.platform.target }}
          combine: true

  package:
    name: Combine platform builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine Windows and macOS builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload combined Geode package
        uses: actions/upload-artifact@v7
        with:
          name: InputBuffer-Windows-macOS
          path: ${{ steps.combine.outputs.build-output }}
          if-no-files-found: error

